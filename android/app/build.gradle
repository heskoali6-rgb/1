plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fixab.iptv'
    compileSdk 35

    defaultConfig {
        applicationId "com.fixab.iptv"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    sourceSets {
        main {
            assets.srcDirs '../../'
            assets.exclude 'android/**', '.github/**', '*.md', 'package.json', 'server.mjs'
        }
    }
}
